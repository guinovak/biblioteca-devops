name: CI/CD

# CI: lint, testes, imagem Docker, Terraform e segurança em todo PR e push.
# CD: só no push para a main (depois do merge de um PR verde):
#   publicar no GHCR -> staging (fumaça + OWASP ZAP) -> produção no ECS (com aprovação)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # cancela PR desatualizado, mas nunca um deploy da main no meio
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGEM: ghcr.io/guinovak/biblioteca-devops

permissions:
  contents: read

jobs:
  qualidade:
    name: Lint e testes (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Instalar o Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Instalar dependências (versões travadas no package-lock)
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Testes unitários e de integração, com cobertura mínima de 80%
        run: npm run test:coverage

      - name: Guardar o relatório de cobertura
        if: matrix.node == 24 && always()
        uses: actions/upload-artifact@v7
        with:
          name: cobertura
          path: coverage/
          retention-days: 14

  imagem:
    name: Build e teste da imagem Docker
    needs: qualidade
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Preparar o Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Construir a imagem
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: biblioteca-api:${{ github.sha }}
          build-args: APP_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Subir o container
        run: docker run -d --name api -p 3000:3000 biblioteca-api:${{ github.sha }}

      - name: Teste de fumaça no container
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/health && break
            sleep 1
          done
          echo
          curl -sf http://localhost:3000/health | grep -q '"status":"ok"'

          curl -sf -X POST http://localhost:3000/livros \
            -H 'Content-Type: application/json' \
            -d '{"titulo":"Dom Casmurro","autor":"Machado de Assis","ano":1899}'
          echo
          curl -sf http://localhost:3000/livros | grep -q 'Dom Casmurro'
          echo "Teste de fumaça passou"

      - name: Logs do container (se algo falhar)
        if: failure()
        run: docker logs api

  infraestrutura:
    name: Validação do Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Instalar o Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.2

      - name: Formatação (terraform fmt)
        run: terraform fmt -check -recursive -diff

      - name: Inicializar sem backend (não precisa de credencial da AWS)
        run: terraform init -backend=false -input=false

      - name: Validar a configuração (terraform validate)
        run: terraform validate

  seguranca:
    name: Segurança (dependências e imagem)
    needs: qualidade
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Instalar o Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Auditoria das dependências de produção (falha em alta ou crítica)
        run: npm audit --omit=dev --audit-level=high

      - name: Preparar o Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Construir a imagem para a varredura
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: biblioteca-api:scan
          cache-from: type=gha

      - name: Varredura da imagem com Trivy (falha em CVE crítica com correção)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: biblioteca-api:scan
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

  publicar:
    name: "CD 1/3: Publicar imagem no GHCR"
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [qualidade, imagem, infraestrutura, seguranca]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Preparar o Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Entrar no GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir e publicar (tag do commit e latest)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: APP_COMMIT=${{ github.sha }}
          tags: |
            ${{ env.IMAGEM }}:${{ github.sha }}
            ${{ env.IMAGEM }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  staging:
    name: "CD 2/3: Staging (fumaça e OWASP ZAP)"
    needs: publicar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    permissions:
      contents: read
      packages: read

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Entrar no GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Subir a imagem publicada com Docker Compose
        env:
          IMAGEM: ${{ env.IMAGEM }}:${{ github.sha }}
        run: ./scripts/deploy-local.sh

      - name: Conferir que o commit no ar é o deste pipeline
        run: curl -sf http://localhost:3000/health | grep -q '"commit":"${{ github.sha }}"'

      - name: Teste dinâmico de segurança (DAST) com OWASP ZAP
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://localhost:3000
          allow_issue_writing: false
          fail_action: false
          artifact_name: relatorio-zap

      - name: Logs do container (se algo falhar)
        if: failure()
        run: docker compose logs api

  producao:
    name: "CD 3/3: Produção no AWS ECS"
    needs: staging
    # liga quando a variável DEPLOY_AWS = true (Learner Lab aberto e secrets válidos)
    if: vars.DEPLOY_AWS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: producao
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      contents: read
      packages: read

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Credenciais da AWS (Learner Lab, renovadas a cada sessão)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Entrar no GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy no ECS com rollback automático
        id: deploy
        env:
          IMAGEM_ORIGEM: ${{ env.IMAGEM }}:${{ github.sha }}
          TAG: ${{ github.sha }}
        run: ./scripts/deploy-ecs.sh
