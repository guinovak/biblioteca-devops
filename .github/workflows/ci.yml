name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualidade:
    name: Lint e testes (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Instalar o Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Instalar dependências (versões travadas no package-lock)
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Testes unitários e de integração, com cobertura mínima de 80%
        run: npm run test:coverage

      - name: Guardar o relatório de cobertura
        if: matrix.node == 24 && always()
        uses: actions/upload-artifact@v7
        with:
          name: cobertura
          path: coverage/
          retention-days: 14

  imagem:
    name: Build e teste da imagem Docker
    needs: qualidade
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Preparar o Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Construir a imagem
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: biblioteca-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Subir o container
        run: docker run -d --name api -p 3000:3000 biblioteca-api:${{ github.sha }}

      - name: Teste de fumaça no container
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/health && break
            sleep 1
          done
          echo
          curl -sf http://localhost:3000/health | grep -q '"status":"ok"'

          curl -sf -X POST http://localhost:3000/livros \
            -H 'Content-Type: application/json' \
            -d '{"titulo":"Dom Casmurro","autor":"Machado de Assis","ano":1899}'
          echo
          curl -sf http://localhost:3000/livros | grep -q 'Dom Casmurro'
          echo "Teste de fumaça passou"

      - name: Logs do container (se algo falhar)
        if: failure()
        run: docker logs api

  infraestrutura:
    name: Validação do Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Instalar o Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.2

      - name: Formatação (terraform fmt)
        run: terraform fmt -check -recursive -diff

      - name: Inicializar sem backend (não precisa de credencial da AWS)
        run: terraform init -backend=false -input=false

      - name: Validar a configuração (terraform validate)
        run: terraform validate
